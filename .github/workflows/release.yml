name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Create archive with selected files and directories
        run: |
          tar -czf release.tar.gz \
            sei/ \
            sip/ \
            LICENSE \
            README.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release.tar.gz
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
